name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest -v

  frontend:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run frontend tests
        run: npm test -- --run

  fhir:
    name: FHIR bundle validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate the database
        run: python scripts/demo_persist.py

      - name: Extract a sample FHIR bundle
        run: |
          python -c "
          import sqlite3, json
          conn = sqlite3.connect('onehealth.db')
          row = conn.execute('SELECT bundle FROM fhir_bundles LIMIT 1').fetchone()
          with open('ci-fhir-bundle.json', 'w') as f:
              f.write(row[0])
          print(f'Wrote bundle with {len(json.loads(row[0]).get(\"entry\", []))} entries')
          "

      - name: Verify bundle structure
        run: |
          python -c "
          import json
          bundle = json.load(open('ci-fhir-bundle.json'))
          assert bundle['resourceType'] == 'Bundle', 'Not a Bundle'
          assert bundle['type'] == 'collection', 'Wrong bundle type'
          entries = bundle.get('entry', [])
          assert len(entries) >= 5, f'Too few entries: {len(entries)}'
          for e in entries:
              assert 'fullUrl' in e, 'Missing fullUrl'
              assert 'resource' in e, 'Missing resource'
          profiles = [
              e['resource']['meta']['profile'][0]
              for e in entries
              if 'meta' in e['resource'] and 'profile' in e['resource'].get('meta', {})
          ]
          assert any('hl7.eu/fhir/ig/oah' in p for p in profiles), 'No OAH profile found'
          print(f'Bundle OK: {len(entries)} entries, {len(set(profiles))} OAH profiles')
          "

      - name: Upload FHIR bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhir-bundle-sample
          path: ci-fhir-bundle.json
          retention-days: 30

  load-test:
    name: Pipeline load test (500 observations)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic dataset
        run: python scripts/generate_synthetic.py

      - name: Run load test
        run: python scripts/load_test.py

      - name: Verify load test report
        run: |
          python -c "
          import json
          r = json.load(open('docs/load-test-report.json'))
          assert r['errors'] == 0, 'Load test errors'
          assert r['input_count'] == 500, 'Wrong input count'
          assert r['output_count'] == 500, 'Records dropped'
          assert r['throughput_obs_per_second'] > 5, f'Too slow: {r[\"throughput_obs_per_second\"]}'
          print(f'Load test OK: {r[\"throughput_obs_per_second\"]} obs/sec')
          "

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: docs/load-test-report.json
          retention-days: 30

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Populate the database
        run: python scripts/demo_persist.py

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend in background
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Backend is ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/health || (cat /tmp/backend.log && exit 1)

      - name: Start frontend in background
        run: |
          npm run dev > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Frontend is ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:5173 || (cat /tmp/frontend.log && exit 1)

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14